name: Release drift

# Ground-truth check that the asset names this extension computes still match
# rumdl's published release assets. Weekly, plus on demand.
on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  check-assets:
    name: Check release assets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.100.0
      - run: make check-assets
        env:
          GH_TOKEN: ${{ github.token }}
