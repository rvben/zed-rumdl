name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Lets the publish workflow run this gate on the tagged commit.
  workflow_call:

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - run: make toolchain
      - uses: Swatinem/rust-cache@v2
      - run: make fmt-check
      - run: make lint

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - run: make toolchain
      - uses: Swatinem/rust-cache@v2
      - run: make test

  build:
    name: Build WASM
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - run: make toolchain
      - uses: Swatinem/rust-cache@v2
      - run: make build-wasm
